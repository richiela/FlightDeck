<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" fill="none">
  <!-- Striped booth backdrop -->
  <defs>
    <pattern id="boothStripes" patternUnits="userSpaceOnUse" width="56" height="380">
      <rect width="28" height="380" fill="#0B3F8C"/>
      <rect x="28" width="28" height="380" fill="#0E4A9E"/>
    </pattern>

    <g id="duck">
      <!-- Pole -->
      <rect x="-5" y="78" width="10" height="78" rx="3" fill="#F2F7FF"/>
      <!-- Body -->
      <ellipse cx="6" cy="52" rx="40" ry="28" fill="#F4FBFF"/>
      <ellipse cx="22" cy="55" rx="18" ry="12" fill="#D7EAF8"/>
      <ellipse cx="-8" cy="55" rx="16" ry="18" fill="#FFFFFF"/>
      <!-- Neck / head -->
      <path d="M-20 38 C-30 28 -34 14 -28 4 C-24 -4 -10 -6 0 2 C10 10 12 26 4 38 Z" fill="#F4FBFF"/>
      <circle cx="-12" cy="-2" r="20" fill="#F4FBFF"/>
      <!-- Beak -->
      <path d="M-30 -2 L-50 -6 L-50 4 L-30 2 Z" fill="#F4A024"/>
      <!-- Eye -->
      <circle cx="-16" cy="-6" r="3.5" fill="#1A2744"/>
      <circle cx="-14.8" cy="-7.2" r="1.1" fill="#fff"/>
      <!-- Target on side -->
      <circle cx="2" cy="52" r="20" fill="#E11D48"/>
      <circle cx="2" cy="52" r="12" fill="#FFE4EC"/>
      <circle cx="2" cy="52" r="6.5" fill="#FF2D7B"/>
    </g>
  </defs>

  <rect x="18" y="18" width="864" height="344" rx="18" fill="url(#boothStripes)"/>

  <!-- Soft top wash -->
  <rect x="18" y="18" width="864" height="54" rx="18" fill="#123F86" opacity="0.35"/>

  <!-- Water / waves -->
  <path d="M30 268
           C90 248 140 292 200 270
           C260 248 310 292 370 270
           C430 248 480 292 540 270
           C600 248 650 292 710 270
           C770 248 820 292 870 270
           L870 350 Q870 362 858 362 H42 Q30 362 30 350 Z"
        fill="#5EB7FF"/>
  <path d="M30 286
           C90 266 140 310 200 288
           C260 266 310 310 370 288
           C430 266 480 310 540 288
           C600 266 650 310 710 288
           C770 266 820 310 870 288
           L870 350 Q870 362 858 362 H42 Q30 362 30 350 Z"
        fill="#7EC8FF" opacity="0.85"/>
  <path d="M40 300
           C100 284 150 318 210 300
           C270 282 320 318 380 300
           C440 282 490 318 550 300
           C610 282 660 318 720 300
           C780 282 820 318 860 300"
        stroke="#B8E4FF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <use href="#duck" x="220" y="118"/>
  <use href="#duck" x="450" y="118"/>
  <use href="#duck" x="680" y="118"/>
</svg>
